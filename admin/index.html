<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login Admin — Paham Pemilu</title>
<link rel="stylesheet" href="../assets/admin.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  .login-page{
    background:
      radial-gradient(circle at 20% 30%,rgba(139,92,246,.4),transparent 50%),
      radial-gradient(circle at 80% 70%,rgba(236,72,153,.4),transparent 50%),
      linear-gradient(135deg,#0f172a,#1e1b4b)!important;
  }
  .login-logo{
    background:linear-gradient(135deg,#8b5cf6,#ec4899)!important;
    box-shadow:0 12px 30px rgba(139,92,246,.5)!important;
    animation:bounceY 3s ease-in-out infinite;
  }
  @keyframes bounceY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .login-box button{
    background:linear-gradient(135deg,#8b5cf6,#ec4899)!important;
    transition:transform .2s,box-shadow .2s;
  }
  .login-box button:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 24px rgba(139,92,246,.45);
  }
</style>
</head>
<body class="login-page">
<script>
  if (sessionStorage.getItem('ap_admin') === '1') location.replace('dashboard.html');
</script>
<div class="login-box">
  <div class="login-logo">PP</div>
  <h1>Panel Admin</h1>
  <p>Paham Pemilu</p>
  <div id="errorBox" style="display:none" class="alert error"></div>
  <form id="loginForm">
    <label>Username</label>
    <input name="username" id="username" required autofocus autocomplete="username">
    <label>Password</label>
    <input type="password" name="password" id="password" required autocomplete="current-password">
    <button type="submit">Masuk</button>
  </form>
  <div style="margin-top:20px;padding:12px;background:#f1f5f9;border-radius:8px;font-size:12px;color:#475569">
    <b>Demo login:</b> admin / admin123
  </div>
  <a href="../index.html" class="back-link">← Kembali ke Website</a>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;
  if (u === 'admin' && p === 'admin123') {
    sessionStorage.setItem('ap_admin', '1');
    sessionStorage.setItem('ap_admin_nama', 'Administrator');
    location.href = 'dashboard.html';
  } else {
    const eb = document.getElementById('errorBox');
    eb.textContent = 'Username atau password salah';
    eb.style.display = 'block';
  }
});
</script>
</body>
</html>
